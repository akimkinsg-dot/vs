name: Build VibeSpark (macOS arm64)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DVIBESPARK_LIVE_MODE=ON \
            -DVIBESPARK_COPY_AFTER_BUILD=OFF

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --config Release -j 4 --verbose
          echo "== VST3 bundles =="
          find build -type d -name "*.vst3" -print

      - name: Ad-hoc sign and zip
        shell: bash
        run: |
          set -euxo pipefail
          VST3="$(find build -type d -name "*.vst3" | head -n 1)"
          if [[ -z "$VST3" ]]; then
            echo "No VST3 bundle found under build/"
            find build -maxdepth 8 -print
            exit 1
          fi

          echo "Signing: $VST3"
          codesign --force --deep -s - "$VST3"
          ditto -c -k --keepParent "$VST3" VibeSpark-VST3-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VibeSpark-VST3-macOS-arm64
          path: VibeSpark-VST3-macOS-arm64.zip
